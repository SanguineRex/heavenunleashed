hea_dynamic_taming_rivers: "Taming the §BRivers§!"
hea_dynamic_taming_rivers_desc: "The §BRivers§! of the Wasteland are the lifeblood of any trading empire, truthfully, we aren't one, but if we ever hope to spread the Light of the Lord all across this blightful land, then the waters of §W[HEA.GetNameWithFlag]§! will need to be tamed."

hea_dynamic_taming_lands: "Taming the §8Lands§!"
hea_dynamic_taming_lands_desc: "Pipelines act as highways and methods to extend the blessing to all of the faithful, crops are planted and harvested by the faithful using ancient skills, and our smiths ensure our warriors can ensure the peace is kept...but why should we stop at adequate?"
hea_steam_smiths_weapon: "Steam Smiths Weapons"

hea_dynamic_taming_heavens: "Taming the §4Heavens§!"
hea_dynamic_taming_heavens_desc: "The Stagleap Mountains have been our protectors and guardians since our ancestors settled in the Nucleus but even after two hundred years we haven't truly settled the spires and crags, until now..."

