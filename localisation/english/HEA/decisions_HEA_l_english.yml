##Northwestern Commonwealth States Group
#Idaho
hea_state_manage_gui_idaho_button_tt: "Idaho: Controlled by §W[HEA.GetNameWithFlag]§!"
state_manage_gui_idaho_button_delay_tt: "§L\"The Gate was not built—it was revealed.\"\n\nIdaho is not merely land. It is the cradle of Revelation, the land where the first hymns of steam and salvation echoed across pine and ruin. Every inch is sacred, etched by the hands of saints, watered by the blood of pilgrims, and sanctified in the fires of the First Crusade. To surrender it is unthinkable. To partition it, heresy. Those who hold it without blessing must be corrected by prayer or by flame.§!"
hea_state_manage_idaho_demand_rot_decision: "Reclaim Northern Idaho"
hea_state_manage_idaho_demand_rot_decision_tt: "If §O[ROT.GetNameWithFlag]§! are §4friendly§! with us, they will be §Gmore likely§! to return our northern territories."
hea_state_manage_idaho_demand_bdt_decision: "Reclaim Southwest Idaho"
hea_state_manage_idaho_demand_bdt_decision_tt: "If §0[BDT.GetNameWithFlag]§! are §4friendly§! with us, they will be §Gmore likely§! to return our northern territories."
hea_state_manage_idaho_demand_bdt_delay_decision_tt: "If §0[BDT.GetNameWithFlag]§! conquered §4[SHO.GetNameWithFlag]§!, we will instead §Yrequest§! the territory from them."
hea_state_manage_idaho_integrate_north_decision: "Integrate Northern Idaho."
hea_state_manage_idaho_pacify_dynamic_decision: "§RSuppress§! [FROM.GetNameWithFlag] heretics!"

#Oregon
no_state_manage_gui_oregon_button_tt: "Oregon: §gNo Influence§!"
hea_state_manage_gui_oregon_button_tt: "Oregon: Controlled by §W[HEA.GetNameWithFlag]§!"
bdt_state_manage_gui_oregon_button_tt: "Oregon: Controlled by §0[BDT.GetNameWithFlag]§!"
state_manage_gui_oregon_button_delay_tt: "§L\"The land moans. The water seethes. The people devour each other.\"\n\nOregon is a graveyard of false faiths and broken tribes. Mirelurk cults worship titans in the rivers. Cannibals quote scripture as they carve. Nephilim, twisted giants of green muscle, roam in packs beneath shattered billboards. And yet, even here, light may rise. Cain and his ilk have begun carving order from blood and madness. So long as their rites align with purpose, the Gate shall not interfere. But the fires must be kept burning. This land cannot be left to rot.§!\n\nOregon control requirement:\n - Crowshaven"
bdt_state_manage_oregon_mandate_decision: "Give §YThe Order of Oregon§! to §0[BDT.GetNameWithFlag]§!"
bdt_state_manage_oregon_mandate_decision_tt: "Any §Ycurrent§! and §Yfuture§! states we owned in §YOregon§! will be §Ytransferred§! to §0[BDT.GetNameWithFlag]§!\n\n§RThis is irreversible!§!"
state_manage_oregon_order_creation_decision: "Declare §YThe Order of Oregon§!"
state_manage_oregon_order_creation_decision_tt: "The lands of §YOregon§! will become a §Ytributary state§!, providing §Gtithes§! to [HEA.GetNameWithFlag]."
state_manage_oregon_conquest_dynamic_decision: "§RCrusades§! against [FROM.GetNameWithFlag]"

#Washington
no_state_manage_gui_washington_button_tt: "Washington: §gNo Influence§!"
hea_state_manage_gui_washington_button_tt: "Washington: Controlled by §W[HEA.GetNameWithFlag]§!"
rot_state_manage_gui_washington_button_tt: "Washington: Controlled by §O[ROT.GetNameWithFlag]§!"
state_manage_gui_washington_button_delay_tt: "§L\"Their cities did not fall. They simply forgot to die.\"\n\nWashington is a relic of rot and memory. The Washington Brotherhood claws at Seattle, ghouls rule from crumbling halls, and heresies breed in the cracks of old empires. Only the Rotpurgers offer flame with purpose. If they join the Crusade, the land may heal. If not, judgment must fall. This land cannot be left to fester.§!\n\nWashington control requirement:\n - Spokane"
rot_state_manage_washington_mandate_decision: "Give §YThe Order of Washington§! to §O[ROT.GetNameWithFlag]§!"
rot_state_manage_washington_mandate_decision_tt: "Any §Ycurrent§! and §Yfuture§! states we owned in §YWashington§! will be §Ytransferred§! to §O[ROT.GetNameWithFlag]§!\n\n§RThis is irreversible!§!"
state_manage_washington_order_creation_decision: "Declare §YThe Order of Washington§!"
state_manage_washington_order_creation_decision_tt: "The lands of §YWashington§! will become a §Ytributary state§!, providing §Gtithes§! to [HEA.GetNameWithFlag]."

