##Fervor##
##########
hea_fervor_scripted_loc_final: "Fervor: §RRapturous§!"
hea_fervor_desc_scripted_loc_final: "There is no longer war, only judgment. The world is consumed in revelation and steam. The Gate stands eternal in fire and glory, and all things lesser have been burned away."
hea_fervor_scripted_loc_rising_3: "Fervor: §9Exalted§!"
hea_fervor_desc_scripted_loc_rising_3: "The faithful burn with divine fury. Cities fall like dry grass. Every sermon is a weapon. Every prayer, a spark. We are not merely marching, we are ascending."
hea_fervor_scripted_loc_rising_2: "Fervor: §8Kindled§!"
hea_fervor_desc_scripted_loc_rising_2: "The flame is lit. Knights march. The people shout scripture from the rooftops. The Gate has remembered its purpose, and it is holy war."
hea_fervor_scripted_loc_rising_1: "Fervor: §OEmbered§!"
hea_fervor_desc_scripted_loc_rising_1: "Sparks stir in the heart of the Gate. Old hymns are sung again, and smoke curls from the forges. Something sacred is waking."
hea_fervor_scripted_loc_neutral: "Fervor: §LHolding Vigil§!"
hea_fervor_desc_scripted_loc_neutral: "The fires are banked, not dead. Though the blade is sheathed, the faithful watch the horizon. Pilgrims still kneel, and prayers still rise. We wait, not in weakness, but in warning."
hea_fervor_scripted_loc_idle_phase_1: "Fervor: §4Dulled§!"
hea_fervor_desc_scripted_loc_idle_phase_1: "The sermons still echo, but their heat is gone. Knights polish rusted armor, and the people murmur of peace. It is not yet heresy, but it is close."
hea_fervor_scripted_loc_idle_phase_2: "Fervor: §0Withered§!"
hea_fervor_desc_scripted_loc_idle_phase_2: "The hymns are faint, the steel is cold. Without war, the soul shrinks, and the hands that once held banners now tremble with doubt. The Gate rusts from within."
hea_fervor_scripted_loc_idle_phase_3: "Fervor: §gBlighted§!"
hea_fervor_desc_scripted_loc_idle_phase_3: "The fire has long gone out. The faithful stumble in silence. Heresy festers beneath the ash, and even the machines groan with neglect. We are a kingdom of corpses, holy only in memory."

