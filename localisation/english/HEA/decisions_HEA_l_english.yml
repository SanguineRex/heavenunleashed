hea_monsters_of_the_wastes_cat: "§RMonsters of the Wastes§!"
hea_monsters_of_the_wastes_cat_desc: "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n§t    \"As I live,\" declares the Lord God, \"Surely because My flock has become a prey, My flock has even become food for all the beasts of the field for lack of a shepherd, and My shepherds did not search for My flock, but rather the shepherds fed themselves and did not feed My flock.\"\n   - Ezekiel 34:8§! \n\n - §LGhouls targets purged: [?HEA.hea_monsters_ghouls]§!\n - §GMutants targets purged: [?HEA.hea_monsters_mutants]§!\n - §4Mirelurks targets purged: [?HEA.hea_monsters_mirelurks]§!\n - §gRobots targets purged: [?HEA.hea_monsters_robots]§!\n - §RCommunists targets purged: [?HEA.hea_monsters_communists]§!"

hea_triump_of_christ_tt: "§YThe Triumph Of Christianity Over Paganism§!"
hea_triump_of_christ_delay_tt: "- Gustave Doré (1868)\n\n§L\"The Triumph of Christianity over Paganism\" is an illustration by Gustave Doré, a renowned 19th-century French artist. This artwork, like many of Doré's pieces, is rich in detail and symbolism, reflecting the artist's deep engagement with religious and mythological themes.\n\nAt the top of the illustration, Christ is depicted holding a cross, symbolizing his crucifixion and victory over sin and death. He is surrounded by the \"Host of Heaven\", a multitude of angels who represent divine support and the heavenly army. Below Christ, the Archangel Michael is shown leading the charge against the forces of paganism. Michael is often portrayed as a warrior angel in Christian art, signifying the struggle against evil and falsehood.\n\nCentral to the composition are Zeus, the king of the Greek gods, and Hera, his wife. Zeus is shown with his thunderbolt, a symbol of his power, while Hera is depicted as his consort. The illustration features various pagan gods and mythological figures, including Aphrodite, Athena, Ares, Hephaestus, Hermes, Dionysus, Helios, and Orpheus. Each of these figures represents different aspects of the ancient polytheistic religions. Figures such as the Pharaoh, representing Egyptian deities, Mithras from Persian mythology, and gods of the orient also appear, highlighting the broad spectrum of paganism being challenged by Christianity.\n\nAt the bottom of the illustration, Satan and other demonic figures are depicted. They symbolize the forces of evil and darkness that are being vanquished by the light of Christianity. The illustration includes symbols from Assyrian and Persian mythology, such as the Lamassus, winged lions, and rams, emphasizing the universal scope of paganism. Various symbolic creatures, such as the Sacred Bull and the Winged Lion and Ram, are included. These represent the pagan world's mythological diversity and the richness of pre-Christian religious traditions."

##The Dead are Walking
hea_monsters_wastes_deads_dynamic_decision: "§RPurge§! §L[FROM.GetNameWithFlag]§!"
hea_monsters_wastes_deads_dynamic_decision_desc: " For if we live, we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die, we are the Lord's. \n -Romans 14:8 \n These wayward souls who are neither dead nor alive need be put to rest, so that their souls can wander ever forward to purgatory or nirvana."
hea_monsters_ghouls: "§LGhouls Targets Purged§!"

##Horde of Nephilim
hea_monsters_wastes_nephilim_dynamic_decision: "§RPurge§! §G[FROM.GetNameWithFlag]§!"
hea_monsters_wastes_nephilim_dynamic_decision_desc: " For if God spared not the angels that sinned, but cast them down to hell, and delivered them into chains of darkness, to be reserved unto judgment \n -Peters 2:4 \n There they stand, the Nephilim, unbound by chains, and waging war in bloody conquest as the Lord knew they would, the full might of Heaven's Gate will meet the Nephilim and save the flock."
hea_monsters_mutants: "§GMutants Targets Purged§!"

##Leviathans dwelling in the Coast
hea_monsters_wastes_leviathans_dynamic_decision: "§RPurge§! §4[FROM.GetNameWithFlag]§!"
hea_monsters_wastes_leviathans_dynamic_decision_desc: " In that day the LORD with his sore and great and strong sword shall punish leviathan the piercing serpent, even leviathan that crooked serpent; and he shall slay the dragon that is in the sea.\n -Isaiah 27:1 \n The creatures of the sea wage open war, and men worship them freely, the Lord has not yet banished them, for are we, the faithful, not the Lord's sword?"
hea_monsters_mirelurks: "§4Mirelurks Targets Purged§!"

##Steel Puppets
hea_monsters_wastes_steel_dynamic_decision: "§RPurge§! §g[FROM.GetNameWithFlag]§!"
hea_monsters_wastes_steel_dynamic_decision_desc: " Heaven's Gate welcomes all lost sheep to the flock, but those who would twist theiry body with metal, or were not born of a womb at all? They were not lovingly crafted by the Father, they're an abomination of the Old World, and we need only look around to see what wonders the Old World has to offer."
hea_monsters_robots: "§gRobots Targets Purged§!"

##The Red Devils
hea_monsters_wastes_red_dynamic_decision: "§RPurge§! §R[FROM.GetNameWithFlag]§!"
hea_monsters_wastes_red_dynamic_decision_desc: " Freedom lies in being bold. \n -Robert Frost \n There was a threat spoken of in great length before the bombs fell, the Socialists, the Communist, the Red Devils. The armies of the Lord will be bold today, for Freedom from the Red Devil's machinations."
hea_monsters_communists: "§RCommunists Targets Purged§!"

