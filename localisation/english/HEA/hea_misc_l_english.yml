l_english:

hea_guardone: "Soldiers of God"
hea_guardone_desc: "Our men must fight for more than their friends, families, or glory; they fight for God."

hea_skillone: "Students of the Blade"
hea_skillone_desc: "A lot of the Guard don't understand how to properly use their weapons, though they can fire, aim, shoot, or get into their stances and swing (in the case of our true warriors), that's not all there is to warfare."

hea_skilltwo: "Acolytes of the Blade"
hea_skilltwo_desc: "The guard now understands how to properly use their weapons, though there is a lot to be desired, some of the Guard can be compared to our knights..."

hea_skillthree: "Masters of the Blade"
hea_skillthree_desc: "The guard are masters at warfare, being able to shoot or cleave their way through regular infantry!"

hea_swordone: "Novice Smiths"
hea_swordone_desc: "Though our smiths are good at producing weapons en masse, they need to be better, they need to be stronger, and if they don't explode as often the guard wouldn't complain..."

hea_swordtwo: "Journeymen Smiths"
hea_swordtwo_desc: "Our smiths have figured out how to give our weapons an extra oomph, now our weapons can even stand up against armored targets! Provided we have enough men pointed at them..."

hea_swordthree: "Mastersmiths"
hea_swordthree_desc: "It took some time to get our smiths up to snuff, but the Guard appreciates it nonetheless! Our enemies have never fallen with such ease...though our weapons are increasingly volatile."

hea_armorone: "Standardized Armor"
hea_armorone_desc: "A lot of the Guard wears whatever they own as armor, though Heaven's Gate has tried to help ease the matter, but it wasn't until now that we have standardized armor! It may not be great, but its better than Brawhmin Hide"

hea_armortwo: "Tempered Armor"
hea_armortwo_desc: "With some clever blacksmith trick (that is most assuredly not magic), the Guard wears armor that is more likely to carry them through a battle."

hea_armorthree: "Plated Armor"
hea_armorthree_desc: "The guard look almost as good as our knights! It'll take quite the bit of firepower to put one of them down!"

hgh_maritimers: "High Chapel's Maritimers"
hgh_maritimers_desc: "We've bled for the river, died by the river, and we'll continue to do so for as long as we live."

hea_research_test_tech_red_button_tt: "Add technology: §YAnti-tank Rifles§!."