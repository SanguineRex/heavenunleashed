##Northwestern Commonwealth States Group
#Idaho
hea_state_manage_gui_idaho_button_tt: "Idaho: Controlled by §W[HEA.GetNameWithFlag]§!"
state_manage_gui_idaho_button_delay_tt: "£GFX_embed_test_embed \n\n\n\n\n£GFX_embed_hea_state_idaho_texticon\n\n\n\n\n\n\n\n\"The Gate was not built—it was revealed.\"\n\n§LIdaho is not merely land. It is the cradle of Revelation, the land where the first hymns of steam and salvation echoed across pine and ruin. Every inch is sacred, etched by the hands of saints, watered by the blood of pilgrims, and sanctified in the fires of the First Crusade. To surrender it is unthinkable. To partition it, heresy. Those who hold it without blessing must be corrected by prayer or by flame.§!"
hea_state_manage_idaho_demand_rot_decision: "For the Stewardship of the Holy Land"
hea_state_manage_idaho_demand_rot_decision_desc: "The valleys of Coeur d'Alene and the northern ranges of Idaho are holy land. Their soil remembers the first pilgrims, their rivers the ashes of the fallen. Not all see it as sacred. But to §W[HEA.GetNameWithFlag]§!, it has ever been hallowed ground.\n\nWe come not as conquerors, but as caretakers, to guard what was bought in faith, and to let the stewards of Revelation guide what was always theirs to keep."
hea_state_manage_idaho_demand_rot_decision_tt: "If §O[ROT.GetNameWithFlag]§! are §4friendly§! with us, they will be §Gmore likely§! to return our northern territories."
hea_state_manage_idaho_demand_bdt_decision: "By Right of Flame"
hea_state_manage_idaho_demand_bdt_decision_desc: "The land remembers the hymns once sung upon it. Southwest Idaho is not just soil, it is sacred ground, trod by saints, watered with pilgrim blood, and scorched in the fires of Revelation. We will not leave it in the hands of heretics or the hesitant.\n\nWe reclaim what was lost. By covenant, if possible. By flame, if not."
hea_state_manage_idaho_demand_bdt_decision_tt: "If §0[BDT.GetNameWithFlag]§! are §4friendly§! with us, they will be §Gmore likely§! to return our northern territories."
hea_state_manage_idaho_demand_bdt_delay_decision_tt: "If §0[BDT.GetNameWithFlag]§! conquered §4[SHO.GetNameWithFlag]§!, we will instead §Yrequest§! the territory from them."
hea_state_manage_idaho_integrate_north_decision: "Integrate Northern Idaho."
hea_state_manage_idaho_integrate_north_decision_desc: "For 150 days, the Fold spreads, not in war, but in word. Northern Idaho is sacred land, once scarred by exile and heresy. It has returned to the Gate, and now it must be made whole.\n\nMissionaries walk the old roads. Banners are raised above courthouses. Steam hums in forgotten channels. The people still speak with the accent of the Rotpurgers, but their children will know better.\n\nThis is no annexation.\n§YThis is a homecoming.§!"
hea_state_manage_idaho_pacify_dynamic_decision: "§RSuppress [FROM.GetNameWithFlag] heretics!§!"
hea_state_manage_idaho_pacify_dynamic_decision_desc: "Root out pockets of unbelief and restore the Fold's order.\n\nWe march the faithful against the heretical remnants of the [FROM.GetNameWithFlag].\nLet mercy reach the penitent, and judgment fall upon the rest."

#Oregon
no_state_manage_gui_oregon_button_tt: "Oregon: §gNo Influence§!"
hea_state_manage_gui_oregon_button_tt: "Oregon: Controlled by §W[HEA.GetNameWithFlag]§!"
bdt_state_manage_gui_oregon_button_tt: "Oregon: Controlled by §0[BDT.GetNameWithFlag]§!"
state_manage_gui_oregon_button_delay_tt: "£GFX_embed_test_embed \n\n\n\n\n£GFX_embed_hea_state_oregon_texticon\n\n\n\n\n\n\n\n\"The land moans. The water seethes. The people devour each other.\"\n\n§LOregon is a graveyard of false faiths and broken tribes. Mirelurk cults worship titans in the rivers. Cannibals quote scripture as they carve. Nephilim, twisted giants of green muscle, roam in packs beneath shattered billboards. And yet, even here, light may rise. Cain and his ilk have begun carving order from blood and madness. So long as their rites align with purpose, the Gate shall not interfere. But the fires must be kept burning. This land cannot be left to rot.§!§Y\n\nOregon control requirement:\n - Crowshaven§!"
bdt_state_manage_oregon_mandate_decision: "Entrust the §YWestern Penance§! to §0[BDT.GetNameWithFlag]§!"
bdt_state_manage_oregon_mandate_decision_desc: "The land once called Oregon has known only idols and indulgence. Now it bows beneath the yoke of repentance. The Seraph Lords name it healed; we name it watched.\n\nIn their hands, the faithful may yet flourish, but the soil is untested, and the hearts uncertain. This stewardship is not a reward. It is a trial. Mercy is not freedom. It is duty. It is debt.\n\n§tLet us see if they prove worthy of it.§!"
bdt_state_manage_oregon_mandate_decision_tt: "Any §Ycurrent§! and §Yfuture§! states we owned in §YOregon§! will be §Ytransferred§! to §0[BDT.GetNameWithFlag]§!\n\n§RThis is irreversible!§!"
state_manage_oregon_order_creation_decision: "Declare §YThe Order of Oregon§!"
state_manage_oregon_order_creation_decision_tt: "The lands of §YOregon§! will become a §Ytributary state§!, providing §Gtithes§! to [HEA.GetNameWithFlag]."
state_manage_oregon_conquest_dynamic_decision: "§RCrusades§! against [FROM.GetNameWithFlag]"
state_manage_oregon_conquest_dynamic_decision_desc: "[hea_state_manage_oregon_conquest_scripted_loc]"
hea_state_manage_oregon_conquest_scripted_loc_default: "Heretic stands where the faithful should kneel. We will unmake them. With psalm and spear we march; flame on false altars, iron on the obstinate. Let the idols crack and the flock be mended."
hea_state_manage_oregon_conquest_scripted_loc_TRL: "They were not monsters when they were made.\n\nThe Nephilim were born of God's light, children of radiance and strength, shaped to protect and guide. But they turned from purpose and sought dominion instead, twisting His gift into mockery.\n\nNow they drown men in FEV and call it rebirth. They claim to forge a new Eden from flesh. We shall answer this blasphemy with sanctified fire and show them the fate of false angels.\n\n§tLet the Nephilim remember the sin of their fathers.§!"
hea_state_manage_oregon_conquest_scripted_loc_MLT: "Idols of shell and tide, prophets of hunger and rot.\n\nThe Mirelurk Tribe kneels before a beast and names it god. Their \"Coral Court\" speaks with voices not their own, and their queen, M'lulu, spawns blasphemy in the dark.\n\nThey feast upon the flesh of men and call it sacrament. Their tunnels spread like infection, their faith like mold upon holy waters. We march to cleanse the coast and cast down the false goddess beneath the tide.\n\n§tLet the sea boil, and the faithful stand firm.§!"
hea_state_manage_oregon_conquest_scripted_loc_ARR: "Eden bloomed once, and man forgot Who gave it.\n\nArroyo stands as a garden in the waste, a city of light and unity, built by the faithful labor of vault and tribe alike. They were chosen. They were blessed. They were given a Saint, blessed by the almighty.\n\nBut the Chosen is gone, and the Garden wilts in his shadow. Prosperity has dulled their spirit, and beauty has bred pride. They preach harmony, yet have forgotten reverence. We do not march to destroy them, but to remind them.\n\n§tFor even Eden must kneel before its Creator.§!"

