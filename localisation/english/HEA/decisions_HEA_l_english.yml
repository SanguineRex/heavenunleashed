state_manage_gui_washington_button_delay_tt: "£GFX_embed_test_embed \n\n\n\n\n£GFX_embed_hea_state_washington_texticon\n\n\n\n\n\n\n\n\"Their cities did not fall. They simply forgot to die.\"\n\n§LWashington is a relic of rot and memory. The Washington Brotherhood claws at Seattle, ghouls rule from crumbling halls, and heresies breed in the cracks of old empires. Only the Rotpurgers offer flame with purpose. If they join the Crusade, the land may heal. If not, judgment must fall. This land cannot be left to fester.§!\n\n§YWashington control requirement:\n - Spokane§!"
