hea_capturing_scientists: "Already capturing scientists"

hea_alchemist_276: "§4Scientists from [276.GetName]§!"
hea_alchemist_276_desc: "\n§W\"The flame of insight does not always burn in the open.\"§!\n\nAcross the wastes, hidden thinkers and reclusive savants still cling to ancient truths. By bringing them into the fold, whether by scripture or steel, we strengthen the Gate's grasp on the world's forgotten knowledge. Let their wisdom be redeemed."
