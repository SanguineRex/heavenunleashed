hea_building_smiths: "Already constructing steam smiths"

#1385-Western Tunnel
hea_smiths_1385_1: "§8Build steam smiths in [1385.GetName]§!"
hea_smiths_1385_1_desc: "\n§W\"Beneath the soil lies what God has buried for the faithful to find.\"§!\n\nSmithing sites are raised to draw ore and pressure-stone from the deep and begin their shaping. What the land yields, the Gate turns toward purpose, fire, metal, and work in proper order."
hea_smiths_1385_2: "§8Upgrade the steam smiths in [1385.GetName]§!"
hea_smiths_1385_2_desc: "\n§W\"Raw ore is not enough, purity is earned in heat.\"§!\n\nForges are retooled for finer work: heat tempered, pressure balanced, slag driven out. Rough metal becomes true stock, uniform, dependable, ready for higher craft."
