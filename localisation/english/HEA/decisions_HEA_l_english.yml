hea_smiths_final_desc: "\n§W\"The weapon is not merely a tool, it is a testament.\"§!\n\nWith better stock and steadier hands, designs are corrected and failures pared away. Steam engines sear true, seals hold, and the Gate's arms endure the heat of war."

